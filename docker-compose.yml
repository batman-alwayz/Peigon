services:
  vaultdrop:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      STORAGE_PATH: /var/vaultdrop
      TRUST_PROXY: "false"
      TICKET_SECRET: ${TICKET_SECRET:-local-development-ticket-secret-change-me}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
    volumes:
      - vaultdrop-data:/var/vaultdrop/data
      - vaultdrop-uploads:/var/vaultdrop/uploads
volumes:
  vaultdrop-data:
  vaultdrop-uploads:
